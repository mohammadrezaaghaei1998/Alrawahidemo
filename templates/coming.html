{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Al Rawahi | Coming Soon</title>

    <link rel="shortcut icon" type="image/png"
        href="{% static 'assets/images/logos/logo-tab.png' %}">

    <link rel="icon" type="image/png" sizes="32x32"
        href="{% static 'assets/images/logos/logo-tab.png' %}">

    <link rel="icon" type="image/png" sizes="16x16"
        href="{% static 'assets/images/logos/logo-tab.png' %}">

    <link rel="stylesheet"
        href="{% static 'assets/libs/owl.carousel/dist/assets/owl.carousel.min.css' %}">

    <link rel="stylesheet"
        href="{% static 'assets/libs/aos-master/dist/aos.css' %}">

    <link rel="stylesheet"
        href="{% static 'assets/css/styles.css' %}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* =========================
           RESET
        ========================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            background-color: #114087;
            background-image:
                linear-gradient(
                    to right top,
                    #112787,
                    #2345a1,
                    #336abc,
                    #4390d8,
                    #5754f4
                );

            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        .squares {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .squares li {
            position: absolute;
            display: block;

            list-style: none;

            background: rgba(255, 255, 255, 0.10);

            animation: animate 30s linear infinite;

            bottom: -165px;

            width: 25px;
            height: 25px;
        }

        .squares li:nth-child(1) {
            left: 26%;
            width: 90px;
            height: 90px;
            animation-delay: 0s;
        }

        .squares li:nth-child(2) {
            left: 8%;
            width: 5px;
            height: 5px;
            animation-delay: 5s;
            animation-duration: 5s;
        }

        .squares li:nth-child(3) {
            left: 10%;
            width: 15px;
            height: 15px;
            animation-delay: 10s;
        }

        .squares li:nth-child(4) {
            left: 20%;
            width: 20px;
            height: 20px;
            animation-delay: 6s;
            animation-duration: 40s;
        }

        .squares li:nth-child(5) {
            left: 35%;
            width: 80px;
            height: 80px;
            animation-delay: 2s;
        }

        .squares li:nth-child(6) {
            left: 40%;
            width: 40px;
            height: 40px;
            animation-delay: 10s;
        }

        .squares li:nth-child(7) {
            left: 55%;
            width: 200px;
            height: 200px;
        }

        .squares li:nth-child(8) {
            left: 65%;
            width: 15px;
            height: 15px;
            animation-duration: 35s;
        }

        .squares li:nth-child(9) {
            left: 70%;
            width: 25px;
            height: 25px;
            animation-delay: 20s;
            animation-duration: 20s;
        }

        .squares li:nth-child(10) {
            left: 85%;
            width: 100px;
            height: 100px;
            animation-delay: 1s;
            animation-duration: 15s;
        }

        @keyframes animate {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
                border-radius: 30%;
            }

            100% {
                transform: translateY(-1000px) rotate(600deg);
                opacity: 0;
                border-radius: 50%;
            }
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        #middle {
            position: relative;

            z-index: 10;

            width: min(1200px, 100%);

            min-height: 100vh;

            margin: 0 auto;

            padding: 40px clamp(20px, 5vw, 70px);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: clamp(30px, 6vw, 90px);
        }
         #middle h1 {
            color: #FFFFFF;
            font-size: 3.80em;
            /* font-family: 'Satisfy', cursive; */
            text-shadow: 0px 1.5px 1.5px rgba(0, 0, 0, 0.3);
            line-height: 1;
           
        }


        /* =========================
           LOGO
        ========================= */

        .logo-section {
            flex: 0 1 42%;

            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
        }

        .logo-section img {
            display: block;

            width: min(100%, 400px);

            height: auto;

            max-height: 55vh;

            object-fit: contain;
        }


        /* =========================
           CONTENT
        ========================= */

        .coming-section {
            flex: 1 1 58%;

            min-width: 0;

            text-align: left;
        }


        /* =========================
           COMING SOON
        ========================= */

        .coming-title {
            margin: 0;

            color: #000;

            font-family:
                Impact,
                Haettenschweiler,
                'Arial Narrow Bold',
                sans-serif;

            font-size: clamp(48px, 7vw, 105px);

            font-weight: 900;

            line-height: 0.9;

            letter-spacing: 1px;
        }


        /* =========================
           CONTACT INFORMATION
        ========================= */

        .contact-info {
            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px 35px;

            margin-top: 28px;
        }

        .contact-item {
            color: #fff;

            font-size: clamp(12px, 1.2vw, 15px);

            line-height: 1.5;
        }

        .contact-item a {
            color: #fffdfd;

            text-decoration: none;

            transition: opacity 0.2s ease;
        }

        .contact-item a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            #middle {
                gap: 35px;

                padding-left: 35px;
                padding-right: 35px;
            }

            .logo-section {
                flex-basis: 40%;
            }

            .coming-section {
                flex-basis: 60%;
            }

            .logo-section img {
                width: min(100%, 320px);
            }

            .coming-title {
                font-size: clamp(45px, 7vw, 70px);
            }

            .contact-info {
                gap: 8px 20px;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow-x: hidden;
            }

            #middle {
                width: 100%;

                min-height: 100svh;

                padding:
                    45px
                    20px;

                flex-direction: column;

                justify-content: center;

                gap: 35px;

                text-align: center;
            }

            .logo-section {
                width: 100%;

                flex: none;
            }

            .logo-section img {
                width: min(75vw, 300px);

                max-height: 35vh;
            }

            .coming-section {
                width: 100%;

                flex: none;

                text-align: center;
            }

            .coming-title {
                font-size: clamp(
                    44px,
                    14vw,
                    72px
                );

                line-height: 0.9;

                letter-spacing: 0;
            }

            .contact-info {
                width: 100%;

                margin-top: 25px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                gap: 10px;
            }

            .contact-item {
                font-size: 14px;

                max-width: 100%;

                overflow-wrap: anywhere;
            }
        }


        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 400px) {

            #middle {
                padding:
                    30px
                    16px;

                gap: 28px;
            }

            .logo-section img {
                width: 70vw;

                max-width: 260px;
            }

            .coming-title {
                font-size: clamp(
                    40px,
                    15vw,
                    58px
                );
            }

            .contact-info {
                margin-top: 20px;
            }

            .contact-item {
                font-size: 13px;
            }
        }


        /* =========================
           LANDSCAPE MOBILE
        ========================= */

        @media (max-height: 550px) and (orientation: landscape) {

            #middle {
                min-height: 100vh;

                padding:
                    25px
                    30px;

                flex-direction: row;

                gap: 30px;
            }

            .logo-section {
                width: 40%;
            }

            .logo-section img {
                width: min(35vw, 240px);

                max-height: 70vh;
            }

            .coming-section {
                width: 60%;

                text-align: left;
            }

            .coming-title {
                font-size: clamp(
                    38px,
                    8vw,
                    65px
                );
            }

            .contact-info {
                align-items: flex-start;
                justify-content: flex-start;
            }
        }


        /* =========================
           REDUCE ANIMATION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            .squares li {
                animation: none;
            }
        }

    </style>
</head>


<body>

    <!-- BACKGROUND SQUARES -->

    <ul class="squares" aria-hidden="true">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>


    <!-- MAIN CONTENT -->

    <main id="middle">

        <!-- LOGO -->

        <div class="logo-section">

            <img
                src="{% static 'assets/images/logos/logo-h.png' %}"
                alt="Al Rawahi Projects"
            >

        </div>


        <!-- CONTENT -->

        <section class="coming-section">

            <h1 class="coming-title">
                WE'RE COMING SOON
            </h1>


            <div class="contact-info">

                <div class="contact-item">
                   <a href=""> P O Box 343 PC116, Oman</a>
                </div>


                <div class="contact-item">

                    <a href="mailto:inquires@rpoman.com">
                        inquires@rpoman.com
                    </a>

                </div>


                <div class="contact-item">

                    <a href="tel:+96899256262">
                        +968 99256262
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- JS -->

    <script src="{% static 'assets/libs/jquery/dist/jquery.min.js' %}"></script>

    <script src="{% static 'assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>

    <script src="{% static 'assets/libs/owl.carousel/dist/owl.carousel.min.js' %}"></script>

    <script src="{% static 'assets/libs/aos-master/dist/aos.js' %}"></script>

    <script src="{% static 'assets/js/custom.js' %}"></script>

    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>

</body>

</html>
